---
# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python in the build environment.
build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"
  jobs:
    create_environment:
      # The uv version is pinned in .tool-versions at the repo root, which asdf reads automatically
      - "asdf plugin add uv"
      - "asdf install uv"
    install:
      - "uv sync --no-dev"
    post_install:
      - "uv run ansible-galaxy collection install -r docs/requirements.yaml"
    build:
      html:
        - "NO_COLOR=1 uv run mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html"
